<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <!-- スマホのブラウザで全画面表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>マーカーARアプリ</title>

  <!--
    ============================================================
    使い方（開発者向け）v3
    ============================================================
    1. この index.html をそのまま GitHub Pages に公開するだけで動きます。
       ※ カメラを使うため HTTPS が必須です（GitHub Pages は HTTPS なのでOK）。
       ※ ライブラリは CDN から読み込むため、スマホ側の通信が必要です。

    2. マーカーは AR.js 標準の「Hiroマーカー」を使っています。
       追加ファイルなしで認識できます。印刷用の画像は画面右上の
       「？」ボタンから表示・保存できます。

    3. 3Dモデルの差し替え方法（女の子のモデルなど）
       下の <script> 内にある MODEL_CONFIG の modelUrl に
       glTF モデルの URL（例: "./girl.glb"）を指定するだけです。
       .glb 形式（テクスチャ等が1ファイルに含まれる形式）を推奨します。
       modelUrl を設定すると、サンプルの仮モデルは自動で非表示になり、
       指定したモデルが表示されます。大きさ・位置・向きは
       modelScale / modelPosition / modelRotation で調整してください。

    v4での変更点（実機diagで判明したサイズ異常への対策）:
    - video表示が2198x2931、canvasが3908x2931という異常な大きさに
      なっていたため、表示サイズを画面サイズ（100vw x 100vh）に固定し、
      描画バッファも画面サイズに合わせ直す処理を追加

    v3での変更点（「一瞬映って真っ黒」への対策）:
    - 診断表示を常時更新（1.5秒ごと）にし、video要素の表示サイズ・
      表示/非表示・透明度・重なり順、canvasのサイズまで出すようにした
    - videoが停止していたら自動で再生を試みる復旧処理を追加
    - video要素の可視性をCSSで明示（visibility/opacity）
    ============================================================
  -->
  <script>
    // ★★★ ここだけ編集すればモデルを差し替えられます ★★★
    const MODEL_CONFIG = {
      // 例: modelUrl: "./girl.glb",
      modelUrl: "./girl.glb",
      modelScale: "0.2 0.2 0.2",       // 大きさ (x y z)
      modelPosition: "0 0 0",    // 位置   (x y z) ※ y は高さ
      modelRotation: "0 0 0",    // 向き   (x y z) ※ 単位は度
      playAnimation: true,       // モデル内のアニメーションを再生するか
    };
  </script>

  <!-- A-Frame（3D表示）と AR.js（マーカー認識）
       組み合わせはAR.js公式ドキュメントのMarker Based Exampleに合わせています -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    // glTFモデルのアニメーションを再生するための小さなコンポーネント
    // （aframe-extras の animation-mixer の代わり。依存を減らすため自前実装）
    if (window.AFRAME) {
      AFRAME.registerComponent("gltf-anim", {
        init: function () {
          this.mixer = null;
          var self = this;
          this.el.addEventListener("model-loaded", function (e) {
            var model = e.detail && e.detail.model;
            if (model && model.animations && model.animations.length) {
              self.mixer = new AFRAME.THREE.AnimationMixer(model);
              model.animations.forEach(function (clip) {
                self.mixer.clipAction(clip).play();
              });
            }
          });
        },
        tick: function (time, deltaTime) {
          if (this.mixer) this.mixer.update(deltaTime / 1000);
        },
      });
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    /* v4の要：AR.js が body 自体に巨大な width と負の margin-left を
       inline style で付けてしまい、画面全体が左へずれて真っ黒になる。
       !important で画面サイズに固定して上書きする */
    body {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Noto Sans JP", sans-serif;
      background: #000;
    }

    /* AR.js が作るカメラ映像を確実に背面へ、3Dキャンバスをその前面へ。
       v4: AR.js の自動サイズ計算が端末によって異常な大きさになるため、
       表示サイズは画面サイズに固定する（!important で inline style より優先） */
    video {
      z-index: -1 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
    #arjs-video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      object-fit: cover !important;
    }
    /* AR.js/A-Frame がシーン要素自体を巨大化＆左へずらすことがあるため固定 */
    a-scene {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      top: 0 !important;
      left: 0 !important;
    }
    canvas.a-canvas {
      z-index: 1 !important;
      background: transparent !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      top: 0 !important;
      left: 0 !important;
    }

    /* 画面上部のステータス表示 */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      pointer-events: none;
    }
    #status {
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 15px;
      padding: 8px 16px;
      border-radius: 999px;
      text-align: center;
    }
    #status.found {
      background: rgba(22, 163, 74, 0.85);
    }
    #status.error {
      background: rgba(220, 38, 38, 0.85);
    }

    /* 画面下部の診断表示（問題が起きたときの切り分け用） */
    #diag {
      position: fixed;
      left: 8px;
      bottom: 8px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.95);
      background: rgba(0, 0, 0, 0.6);
      font-size: 17px;
      line-height: 1.5;
      font-family: monospace;
      padding: 8px 10px;
      border-radius: 6px;
      max-width: 94vw;
      white-space: pre-wrap;
      pointer-events: none;
    }

    /* 使い方ボタン */
    #help-button {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 11;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      cursor: pointer;
    }

    /* 使い方パネル */
    #help-panel {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    #help-panel.open {
      display: flex;
    }
    #help-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      color: #222;
      font-size: 14px;
      line-height: 1.7;
    }
    #help-card h2 {
      margin-top: 0;
      font-size: 17px;
    }
    #help-card img.marker {
      display: block;
      width: 180px;
      height: 180px;
      margin: 8px auto;
      border: 1px solid #ccc;
    }
    #help-close {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <!-- ステータス表示 -->
  <div id="hud">
    <div id="status">起動中…ライブラリとカメラを準備しています</div>
  </div>
  <button id="help-button" aria-label="使い方">？</button>
  <div id="diag">diag: 初期化待ち</div>

  <!-- 使い方パネル -->
  <div id="help-panel">
    <div id="help-card">
      <h2>使い方</h2>
      <p>
        1. 下の「Hiroマーカー」を印刷するか、別の画面に表示してください。<br />
        2. このページを開いたスマホのカメラでマーカーを映すと、
        マーカーの上に3Dモデルが表示されます。
      </p>
      <img
        class="marker"
        src="https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png"
        alt="Hiroマーカー（印刷用）"
      />
      <p>
        うまく認識しないときは、明るい場所で、マーカー全体が
        画面に入るように少し離れて映してみてください。
      </p>
      <p>
        ※ カメラが起動しない場合は、HTTPSで開いているか、
        ブラウザのカメラ許可を確認してください。
      </p>
      <button id="help-close">閉じる</button>
    </div>
  </div>

  <!-- ================= ARシーン ================= -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- 明かり（差し替えたモデルにも効きます） -->
    <a-entity light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity
      light="type: directional; intensity: 0.8"
      position="1 2 1"
    ></a-entity>

    <!-- Hiroマーカー：認識すると中のコンテンツが表示される -->
    <a-marker id="marker" preset="hiro" emitevents="true">
      <!-- モデル全体の土台。ゆっくり回転させる -->
      <a-entity
        id="model-root"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
      >
        <!-- 影代わりの円盤 -->
        <a-circle
          radius="0.55"
          rotation="-90 0 0"
          position="0 0.01 0"
          material="color: #000; opacity: 0.25; transparent: true"
        ></a-circle>

        <!--
          ==========================================================
          差し替え先：カスタム3Dモデル（glTF / GLB）
          MODEL_CONFIG.modelUrl を設定すると、この要素が使われます。
          通常はHTML側を書き換える必要はありません。
          ==========================================================
        -->
        <a-entity id="custom-model" visible="false"></a-entity>

        <!--
          ==========================================================
          サンプル仮モデル（プリミティブで作った簡易キャラクター）
          MODEL_CONFIG.modelUrl が空のときだけ表示されます。
          実モデルに差し替えたら、このブロックは削除して構いません。
          ==========================================================
        -->
        <a-entity id="placeholder-model" position="0 0 0">
          <!-- 台座 -->
          <a-cylinder
            radius="0.45"
            height="0.08"
            position="0 0.04 0"
            color="#4f46e5"
          ></a-cylinder>
          <!-- ドレス（体） -->
          <a-cone
            radius-bottom="0.30"
            radius-top="0.10"
            height="0.55"
            position="0 0.36 0"
            color="#ec4899"
          ></a-cone>
          <!-- 頭 -->
          <a-sphere radius="0.19" position="0 0.83 0" color="#ffd9b3"></a-sphere>
          <!-- 髪 -->
          <a-sphere
            radius="0.20"
            position="0 0.90 0"
            scale="1 0.85 1"
            color="#6d28d9"
          ></a-sphere>
          <a-box
            width="0.40"
            height="0.35"
            depth="0.10"
            position="0 0.72 -0.16"
            color="#6d28d9"
          ></a-box>
          <!-- 目 -->
          <a-sphere radius="0.025" position="-0.07 0.85 0.17" color="#111"></a-sphere>
          <a-sphere radius="0.025" position="0.07 0.85 0.17" color="#111"></a-sphere>
          <!-- 腕 -->
          <a-cylinder
            radius="0.04"
            height="0.32"
            position="-0.26 0.55 0"
            rotation="0 0 35"
            color="#ffd9b3"
          ></a-cylinder>
          <a-cylinder
            radius="0.04"
            height="0.32"
            position="0.26 0.55 0"
            rotation="0 0 -35"
            color="#ffd9b3"
          ></a-cylinder>
          <!-- ラベル -->
          <a-text
            value="SAMPLE MODEL"
            position="0 1.25 0"
            align="center"
            color="#ffffff"
            scale="0.6 0.6 0.6"
          ></a-text>
        </a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    (function () {
      var statusEl = document.getElementById("status");
      var diagEl = document.getElementById("diag");
      var marker = document.getElementById("marker");
      var customModel = document.getElementById("custom-model");
      var placeholder = document.getElementById("placeholder-model");
      var videoReady = false;
      var lastError = "";
      var playTried = "";

      function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = kind || "";
      }

      function updateDiag() {
        var video = document.querySelector("video");
        var canvas = document.querySelector("canvas");
        var lines = [];
        lines.push(
          "win:" + window.innerWidth + "x" + window.innerHeight +
          " dpr=" + window.devicePixelRatio
        );
        lines.push("AFRAME:" + (window.AFRAME ? "OK" : "NG"));
        lines.push("ARjs:" + (window.ARjs ? "OK" : "?"));
        if (video) {
          var cs = window.getComputedStyle(video);
          var rect = video.getBoundingClientRect();
          lines.push(
            "video:" + video.videoWidth + "x" + video.videoHeight +
            " rs=" + video.readyState +
            " paused=" + video.paused +
            " t=" + video.currentTime.toFixed(1)
          );
          lines.push(
            "video表示:" + video.offsetWidth + "x" + video.offsetHeight +
            " 位置:" + Math.round(rect.x) + "," + Math.round(rect.y) +
            " display=" + cs.display +
            " opacity=" + cs.opacity +
            " z=" + cs.zIndex
          );
          // 映像があるのに止まっていたら再生を試みる
          if (video.videoWidth > 0 && video.paused) {
            var p = video.play();
            playTried = "play試行済";
            if (p && p.catch) {
              p.catch(function () { playTried = "play失敗"; });
            }
          }
        } else {
          lines.push("video:なし");
        }
        if (canvas) {
          var crect = canvas.getBoundingClientRect();
          lines.push(
            "canvas:" + canvas.offsetWidth + "x" + canvas.offsetHeight +
            " 位置:" + Math.round(crect.x) + "," + Math.round(crect.y)
          );
        } else {
          lines.push("canvas:なし");
        }
        if (playTried) lines.push(playTried);
        if (lastError) lines.push("error: " + lastError);
        diagEl.textContent = "diag: " + lines.join(" / ");
        return video;
      }

      // スクリプトエラーが起きたら診断表示に出す（原因の切り分け用）
      window.addEventListener("error", function (e) {
        lastError = e.message || "不明なエラー";
        updateDiag();
      });

      // ----- モデルの差し替え適用 -----
      if (MODEL_CONFIG.modelUrl) {
        customModel.setAttribute("gltf-model", MODEL_CONFIG.modelUrl);
        customModel.setAttribute("scale", MODEL_CONFIG.modelScale);
        customModel.setAttribute("position", MODEL_CONFIG.modelPosition);
        customModel.setAttribute("rotation", MODEL_CONFIG.modelRotation);
        customModel.setAttribute("visible", "true");
        if (MODEL_CONFIG.playAnimation) {
          customModel.setAttribute("gltf-anim", "");
        }
        placeholder.setAttribute("visible", "false");

        customModel.addEventListener("model-loaded", function () {
          setStatus("モデルを読み込みました。マーカーを映してください", "");
        });
        customModel.addEventListener("model-error", function () {
          // 読み込みに失敗したら仮モデルに戻して知らせる
          customModel.setAttribute("visible", "false");
          placeholder.setAttribute("visible", "true");
          setStatus(
            "モデルの読み込みに失敗しました（URLを確認してください）",
            "error"
          );
        });
      }

      // ----- v4: 描画バッファのサイズを画面サイズに合わせ直す -----
      // AR.js の自動計算が巨大なキャンバスを作ると、スマホGPUの上限を
      // 超えて真っ黒になることがあるため、実サイズに固定し直す。
      function fitRenderer() {
        var sc = document.querySelector("a-scene");
        if (sc && sc.renderer) {
          sc.renderer.setSize(window.innerWidth, window.innerHeight, false);
        }
      }
      var sceneEl = document.querySelector("a-scene");
      sceneEl.addEventListener("loaded", function () {
        fitRenderer();
        setTimeout(fitRenderer, 1000);
        setTimeout(fitRenderer, 3000);
      });
      window.addEventListener("resize", function () {
        setTimeout(fitRenderer, 350);
      });

      // ----- AR.js の映像準備完了イベント -----
      var scene = document.querySelector("a-scene");
      scene.addEventListener("arjs-video-loaded", function () {
        videoReady = true;
        setStatus("Hiroマーカーを映してください…", "");
        updateDiag();
      });

      // ----- マーカー認識の状態表示 -----
      marker.addEventListener("markerFound", function () {
        setStatus("マーカーを認識しました！", "found");
        if (navigator.vibrate) navigator.vibrate(50);
      });
      marker.addEventListener("markerLost", function () {
        if (videoReady) setStatus("Hiroマーカーを映してください…", "");
      });

      // ----- 診断表示を常時更新 -----
      setInterval(updateDiag, 1500);
      setTimeout(updateDiag, 500);

      // ----- ウォッチドッグ：映像が来ない場合は段階を表示 -----
      function watchdog() {
        var video = document.querySelector("video");
        if (!window.AFRAME) {
          setStatus("ライブラリ（A-Frame）の読み込みに失敗しました。通信環境を確認して再読み込みしてください", "error");
          return;
        }
        if (!video) {
          setStatus("カメラ映像が始まっていません。カメラ許可と通信環境を確認してください（下部の diag も確認）", "error");
          return;
        }
        if (video.videoWidth === 0) {
          setStatus("カメラは許可されましたが映像が流れていません（下部の diag を確認してください）", "error");
          return;
        }
        videoReady = true;
        if (statusEl.textContent.indexOf("起動中") === 0) {
          setStatus("Hiroマーカーを映してください…", "");
        }
      }
      setTimeout(watchdog, 6000);
      setTimeout(watchdog, 12000);

      // ----- 使い方パネル -----
      var panel = document.getElementById("help-panel");
      document
        .getElementById("help-button")
        .addEventListener("click", function () {
          panel.classList.add("open");
        });
      document
        .getElementById("help-close")
        .addEventListener("click", function () {
          panel.classList.remove("open");
        });
      panel.addEventListener("click", function (e) {
        if (e.target === panel) panel.classList.remove("open");
      });
    })();
  </script>
</body>
</html>
